<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>波浪紋雙層貓抓板插圖</title>
  <rect width="400" height="300" fill="#F3E7D8"/>

  <!-- 抓板本體：雙層 -->
  <rect x="90" y="150" width="220" height="46" rx="10" fill="#E8C79A"/>
  <rect x="90" y="104" width="220" height="46" rx="10" fill="#F2D9B7"/>

  <!-- 波浪瓦楞紋 -->
  <g fill="none" stroke="#C96F2E" stroke-width="3">
    <path d="M100 127 q10 -14 20 0 q10 14 20 0 q10 -14 20 0 q10 14 20 0 q10 -14 20 0 q10 14 20 0 q10 -14 20 0 q10 14 20 0 q10 -14 20 0 q10 14 20 0"/>
    <path d="M100 173 q10 -14 20 0 q10 14 20 0 q10 -14 20 0 q10 14 20 0 q10 -14 20 0 q10 14 20 0 q10 -14 20 0 q10 14 20 0 q10 -14 20 0 q10 14 20 0"/>
  </g>

  <!-- 貓抓刮痕 -->
  <g stroke="#3E2F25" stroke-width="2.4" stroke-linecap="round" opacity="0.55">
    <path d="M150 108 L166 146"/>
    <path d="M170 106 L184 148"/>
    <path d="M192 108 L204 146"/>
  </g>

  <!-- 貓掌動作 -->
  <g fill="#3E2F25">
    <ellipse cx="230" cy="80" rx="24" ry="18" transform="rotate(20 230 80)"/>
    <ellipse cx="212" cy="66" rx="7" ry="9" transform="rotate(10 212 66)"/>
    <ellipse cx="228" cy="58" rx="7" ry="9"/>
    <ellipse cx="246" cy="64" rx="7" ry="9" transform="rotate(-10 246 64)"/>
  </g>

  <!-- 底座陰影 -->
  <ellipse cx="200" cy="214" rx="120" ry="12" fill="#E0CBA8" opacity="0.6"/>
</svg>

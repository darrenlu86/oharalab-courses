<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>耶加雪菲淺焙單品豆插圖</title>
  <rect width="400" height="300" fill="#FBEFE0"/>

  <!-- 站立式豆袋（淺焙：淺棕色） -->
  <path d="M140 90 L260 90 L272 260 Q200 274 128 260 Z" fill="#C9A06C"/>
  <path d="M140 90 L152 70 L248 70 L260 90 Z" fill="#9C5B2B"/>
  <rect x="176" y="58" width="48" height="16" rx="6" fill="#9C5B2B"/>

  <!-- 標籤 -->
  <rect x="150" y="122" width="100" height="92" rx="12" fill="#FFF7EE"/>
  <!-- 柑橘切片圖案，示意柑橘花香風味 -->
  <circle cx="200" cy="160" r="26" fill="#F2A74E"/>
  <circle cx="200" cy="160" r="20" fill="#FCD98B"/>
  <g stroke="#F2A74E" stroke-width="2">
    <line x1="200" y1="140" x2="200" y2="180"/>
    <line x1="180" y1="160" x2="220" y2="160"/>
    <line x1="186" y1="146" x2="214" y2="174"/>
    <line x1="186" y1="174" x2="214" y2="146"/>
  </g>
  <text x="200" y="200" font-family="-apple-system, 'Noto Sans TC', sans-serif" font-size="13" fill="#4b3324" text-anchor="middle">淺焙 · 日曬</text>

  <!-- 咖啡豆散落 -->
  <g fill="#9C5B2B">
    <ellipse cx="108" cy="248" rx="5" ry="6.5"/>
    <ellipse cx="124" cy="256" rx="5" ry="6.5"/>
    <ellipse cx="292" cy="252" rx="5" ry="6.5"/>
  </g>
</svg>

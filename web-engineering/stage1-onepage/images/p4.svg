<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>沖沖經典綜合豆插圖</title>
  <rect width="400" height="300" fill="#F3E6D6"/>

  <!-- 站立式豆袋（招牌配方：深焙棕） -->
  <path d="M136 84 L264 84 L276 262 Q200 278 124 262 Z" fill="#4b3324"/>
  <path d="M136 84 L150 62 L250 62 L264 84 Z" fill="#2b211a"/>
  <rect x="174" y="50" width="52" height="16" rx="6" fill="#2b211a"/>

  <!-- 標籤：店徽風格 -->
  <circle cx="200" cy="164" r="52" fill="#FFF7EE"/>
  <circle cx="200" cy="164" r="52" fill="none" stroke="#9C5B2B" stroke-width="4"/>
  <path d="M178 178 h44 v10 a22 22 0 0 1 -44 0 Z" fill="#4b3324"/>
  <path d="M178 178 h44 v-6 h-44 Z" fill="#2b211a"/>
  <path d="M222 182 q10 0 10 8 t-10 8" fill="none" stroke="#4b3324" stroke-width="4" stroke-linecap="round"/>
  <text x="200" y="150" font-family="-apple-system, 'Noto Sans TC', sans-serif" font-size="12" fill="#4b3324" text-anchor="middle">招牌配方</text>

  <!-- 咖啡豆散落 -->
  <g fill="#2b211a">
    <ellipse cx="104" cy="252" rx="5" ry="6.5"/>
    <ellipse cx="120" cy="260" rx="5" ry="6.5"/>
    <ellipse cx="296" cy="256" rx="5" ry="6.5"/>
    <ellipse cx="280" cy="264" rx="5" ry="6.5"/>
  </g>
</svg>

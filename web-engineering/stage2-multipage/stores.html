    <h1>門市資訊</h1>
    <p>以下兩間門市地址、電話、營業時間為本課程虛構的教學示範資料，非真實營業地點。</p>
  </div>

  <div class="container">
    <div class="grid grid-2">

      <div class="card store-card card-body">
        <h3>台北大安店</h3>
        <p class="badge badge-neutral">2024 年開幕</p>
        <dl>
          <dt>地址</dt>
          <dd>台北市大安區沖沖街 1 號 1 樓</dd>
          <dt>電話</dt>
          <dd>（本頁為課程示範，暫不提供實際聯絡電話）</dd>
          <dt>營業時間</dt>
          <dd>週一至週五 08:00–19:00｜週六、週日 09:00–18:00</dd>
          <dt>座位</dt>
          <dd>提供內用手沖體驗，共 18 席（開幕後增設）</dd>
        </dl>
      </div>

      <div class="card store-card card-body">
        <h3>台中西區店</h3>
        <p class="badge badge-warning">2026 年新開幕</p>
        <dl>
          <dt>地址</dt>
          <dd>台中市西區沖沖路 2 號</dd>
          <dt>電話</dt>
          <dd>（本頁為課程示範，暫不提供實際聯絡電話）</dd>
          <dt>營業時間</dt>

          <dt>座位</dt>
          <dd>提供內用手沖體驗，共 12 席</dd>
        </dl>
      </div>

    </div>

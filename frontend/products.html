<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>全部商品｜喵喵商店 MeowShop</title>
  <meta name="description" content="喵喵商店全商品清單，貓糧、零食、玩具、貓砂、生活用品，依分類與關鍵字搜尋。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
</head>
<body>
  <div id="navbar-root"></div>

  <main>
    <section class="page-section">
      <div class="container">
        <h2 class="section-title">全部商品</h2>

        <!-- 篩選列：分類 chip + 搜尋框，由 products.js 綁定事件、重打 API -->
        <div class="filter-bar">
          <div class="filter-chips" id="filter-chips"></div>
          <div class="search-box">
            <span aria-hidden="true" id="search-icon-slot"></span>
            <input type="search" id="search-input" class="search-input" placeholder="搜尋商品名稱…" aria-label="搜尋商品">
          </div>
        </div>

        <div class="product-grid" id="product-grid">
          <p class="loading-text">商品載入中...</p>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-root"></div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/pages/products.js"></script>
</body>
</html>

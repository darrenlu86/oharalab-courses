<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img">
  <title>鮪魚肉泥條插圖</title>
  <rect width="400" height="300" fill="#FBE0D3"/>

  <!-- 肉泥條（軟管狀） -->
  <g>
    <path d="M150 90 Q140 90 140 106 L140 210 Q140 232 200 232 Q260 232 260 210 L260 106 Q260 90 250 90 Z" fill="#F2A74E"/>
    <path d="M150 90 L160 66 L240 66 L250 90 Z" fill="#C96F2E"/>
    <rect x="182" y="54" width="36" height="14" rx="5" fill="#C96F2E"/>
  </g>

  <!-- 條紋標籤 -->
  <rect x="152" y="128" width="96" height="60" rx="10" fill="#FFF7EE"/>
  <g fill="#E8853D">
